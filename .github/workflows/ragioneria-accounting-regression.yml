name: Ragioneria contabile - regressione Firenze

on:
  push:
    branches: [main]
    paths:
      - 'app/static/js/erp/nucleo.js'
      - 'app/report.py'
      - 'app/blueprints/erp_fi/static/**'
      - 'app/blueprints/erp_tesoreria/static/**'
      - 'app/blueprints/erp_finanza/static/**'
      - 'app/blueprints/erp_chiusura/static/**'
      - 'app/blueprints/erp_costi/static/**'
      - 'app/blueprints/erp_cespiti/static/**'
      - 'app/blueprints/erp_produzione/static/**'
      - 'app/blueprints/erp_vendite/static/**'
      - 'app/blueprints/erp_dati/static/**'
      - 'app/blueprints/erp_bpc/static/**'
      - 'app/blueprints/erp_controllo/static/**'
      - 'app/blueprints/erp_acquisti/static/**'
      - 'app/blueprints/erp_magazzino/static/**'
      - 'app/blueprints/erp_inventario/static/**'
      - 'app/blueprints/erp_spedizione/static/**'
      - 'app/blueprints/erp_valute/static/**'
      - 'app/blueprints/erp_paghe/static/**'
      - 'app/blueprints/guida/static/**'
      - 'app/static/js/lab-motore.js'
      - 'app/static/js/erp/**'
      - 'app/static/vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'tests/esercizio-ragioneria-wms.js'
      - 'tests/test_ragioneria_wms.py'
      - 'tests/pannello-wms.js'
      - 'tests/soluzione-nascosta.js'
      - 'tests/quiz-contabile.js'
      - 'tests/finanza.js'
      - 'tests/esercizio-ragioneria-chiusura.js'
      - '.github/workflows/ragioneria-accounting-regression.yml'

jobs:
  accounting-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Test finanza, parcelle e pagamenti
        run: node tests/finanza.js
      - name: Test esercizio completo, IVA, imposte, chiusura e riapertura
        run: node tests/esercizio-ragioneria-wms.js && node tests/esercizio-ragioneria-chiusura.js
