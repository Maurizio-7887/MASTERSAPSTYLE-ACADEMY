name: Executive Assistant ERP API
on:
  pull_request:
    paths:
      - 'app/blueprints/executive_api/**'
      - 'app/__init__.py'
      - 'app/accesso.py'
      - 'tests/test_executive_api.py'
      - '.github/workflows/executive-assistant-api.yml'
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_executive_api.py
