name: Suite completa (tutti i test)
# Lancia TUTTI i test del repository a ogni pull request e a ogni push su main.
# Le altre CI controllano solo pochi file ciascuna: questa impedisce che un test
# si rompa senza che nessuno se ne accorga.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: suite-completa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tutti:
    name: npm test + tutti i test Python
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MASTERLEDGER_FICO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      # npm test genera anche le fotografie (stato-finale, dicembre, ragioneria, laboratori, _completo)
      # che i test Python leggono: per questo i due passi stanno nello stesso job, in quest'ordine.
      - name: npm test (catena completa)
        run: npm test
      - name: Tutti i test Python, uno per uno
        run: |
          fail=0
          for t in tests/test_*.py; do
            m=$(basename "$t" .py)
            echo "::group::$m"
            if python -m "tests.$m"; then echo "OK $m"; else echo "::error::$m fallito"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      - name: Test del caricatore MasterLedger FI/CO
        run: python -m unittest discover -s tests -p 'test_masterledger_*.py'
