<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Chiusura e apertura dei conti"><rect width="900" height="420" fill="#F4F7F9"/><rect width="900" height="40" fill="#2B2B2B"/><text x="16" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="start">ad hoc Revolution</text><text x="884" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#D8E1EA" font-weight="normal" text-anchor="end">ricostruzione didattica · non è una schermata originale</text><rect y="40" width="900" height="30" fill="#FFFFFF" stroke="#E5E8EB"/><text x="16" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6A6D70" font-weight="normal" text-anchor="start">Contabilità generale · Chiusura/apertura conti</text><text x="16" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#32363A" font-weight="bold" text-anchor="start">Chiusura e apertura dei conti</text><rect x="16" y="108" width="60" height="3" fill="#0054A6"/><text x="16" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Esercizio da chiudere</text><rect x="16" y="141" width="150" height="26" rx="3" fill="#FFFFFF" stroke="#89919A" stroke-width="1"/><text x="24" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">2026</text><text x="182" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Data chiusura</text><rect x="182" y="141" width="150" height="26" rx="3" fill="#FFFFFF" stroke="#89919A" stroke-width="1"/><text x="190" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">31/12/2026</text><text x="348" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Data apertura</text><rect x="348" y="141" width="150" height="26" rx="3" fill="#FFFFFF" stroke="#89919A" stroke-width="1"/><text x="356" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">01/01/2027</text><text x="16" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Conto profitti e perdite</text><rect x="16" y="196" width="260" height="26" rx="3" fill="#FFFFFF" stroke="#E9730C" stroke-width="2"/><text x="24" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">Conto economico</text><text x="292" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Bilancio di chiusura</text><rect x="292" y="196" width="280" height="26" rx="3" fill="#FFFFFF" stroke="#E9730C" stroke-width="2"/><text x="300" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">Stato patrimoniale finale</text><text x="588" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#556B82" font-weight="normal" text-anchor="start">Bilancio di apertura</text><rect x="588" y="196" width="296" height="26" rx="3" fill="#FFFFFF" stroke="#E9730C" stroke-width="2"/><text x="596" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#32363A" font-weight="normal" text-anchor="start">Stato patrimoniale iniziale</text><rect x="16" y="260" width="868" height="26" fill="#EEF1F4" stroke="#D5DADD"/><text x="24" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#32363A" font-weight="bold" text-anchor="start">Fase</text><text x="184" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#32363A" font-weight="bold" text-anchor="start">Che cosa genera</text><rect x="16" y="286" width="868" height="26" fill="#FFFFFF" stroke="#E5E8EB"/><text x="24" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">1 · Epilogo</text><text x="184" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">Costi e ricavi (comprese le variazioni delle rimanenze) → Conto economico; utile o perdita</text><rect x="16" y="312" width="868" height="26" fill="#FAFBFC" stroke="#E5E8EB"/><text x="24" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">2 · Chiusura</text><text x="184" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">Attività, passività e patrimonio netto → Stato patrimoniale finale</text><rect x="16" y="338" width="868" height="26" fill="#FFFFFF" stroke="#E5E8EB"/><text x="24" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">3 · Apertura</text><text x="184" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#32363A" font-weight="normal" text-anchor="start">Gli stessi conti riaperti dallo Stato patrimoniale iniziale al 01/01/2027</text><rect x="704" y="378" width="180" height="30" rx="4" fill="#0054A6"/><text x="794.0" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">F10 — Elabora</text><rect y="386" width="900" height="34" fill="#FFFFFF" stroke="#E5E8EB"/><text x="16" y="407" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#556B82" font-weight="normal" text-anchor="start">Prima di elaborare: rimanenze, ratei, risconti, ammortamenti e imposte già registrati in Prima Nota.</text></svg>